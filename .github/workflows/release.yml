name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (all projects)
        run: |
          cd backend && npm ci
          cd ../frontend/my-react-app && npm ci
          cd ../Admin/admin && npm ci

      - name: Run all tests
        run: |
          cd backend && npm test -- --ci
          cd ../frontend/my-react-app && npm test -- --ci
          cd ../Admin/admin && npm test -- --ci

      - name: Build all projects
        run: |
          cd frontend/my-react-app && npm run build
          cd ../Admin/admin && npm run build

      - name: Build Docker images
        run: |
          docker build -t probmap-backend:${{ github.ref_name }} ./backend
          docker build -t probmap-frontend:${{ github.ref_name }} ./frontend/my-react-app
          docker build -t probmap-admin:${{ github.ref_name }} ./Admin/admin

      - name: Generate changelog
        id: changelog
        run: |
          git log --pretty=format:"- %s (%an)" $(git describe --tags --abbrev=0 HEAD^)..HEAD > changelog.md
          cat changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: changelog.md
          draft: false
          prerelease: false
          files: |
            docker-compose.yml
            .env.example
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}